name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check apps/api tests infrastructure/verify_versions.py examples/versioned-spider
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm run check:lock
      - run: npm ci
      - run: npm test
      - run: npm run build
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: migration_check
          POSTGRES_USER: migration_check
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U migration_check -d migration_check'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CRAWLOPS_DATABASE_URL: postgresql+psycopg://migration_check:ci-only-password@localhost:5432/migration_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: alembic upgrade head
      - run: alembic check
